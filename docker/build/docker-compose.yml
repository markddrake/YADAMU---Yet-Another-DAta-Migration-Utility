
services:
  environment:
    image: yadamu/environment:latest
    build:
      context: ../..
      dockerfile: docker/build/environment
      no_cache: true
      args:
        BUILDKIT_PROGRESS: plain
        # The node image tag, e.g. NODE_VERSION=22 docker compose build environment
        NODE_VERSION: ${NODE_VERSION:-lts}

  base:
    image: yadamu/base:latest
    build:
      context: ../..
      dockerfile: docker/build/yadamu

  regression:
    image: yadamu/regression:latest
    build:
      context: ../..
      dockerfile: docker/build/regression

  commandline:
    image: yadamu/commandline:latest
    build:
      context: ../..
      dockerfile: docker/build/commandLine
      # DOCKER_BUILDKIT is enabled by default in Compose V2

  secure:
    image: yadamu/secure:latest
    build:
      context: ../..
      dockerfile: docker/build/secure

  # secure plus the Teradata driver, which the base images don't include yet
  teradata:
    image: yadamu/teradata:latest
    build:
      context: ../..
      dockerfile: docker/build/teradata

  service:
    image: yadamu/service:latest
    build:
      context: ../..
      dockerfile: docker/build/service

  # secure plus wtfnode, to see what keeps Node from exiting (src/qa/wtf/test.js)
  wtf:
    image: yadamu/wtf:latest
    build:
      context: ../..
      dockerfile: docker/build/wtf
