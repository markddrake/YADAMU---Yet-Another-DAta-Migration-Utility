
# Bounded container logs. json-file has NO size limit by default, so a
# container's log grows until the container is removed. 5 x 20MB = 100MB
# ceiling per container, rotated segments gzipped.
#
# Declared PER SERVICE rather than as a daemon-wide default: log options are
# stamped onto a container when it is CREATED, so setting them here needs no
# dockerd restart, and the value is visible in the file you are reading instead
# of in /etc/docker/daemon.json on some host.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"
    compress: "true"

services:

 # Teradata 17.10 appliance under qemu/KVM: see docker/linux/kvm/README.md.
 # TDVM_BASE is the directory makeBase.sh built. "down" then "up" gives a fresh database;
 # "stop" / "start" keeps the data (the guest's writes live in the container's /vm/run).
 TDATA17-01:
   container_name: TDATA17-01
   hostname: TDATA17-01
   image:  yadamu/teradata:17.10-kvm
   build: docker/linux/kvm
   mem_limit: '10gb'
   networks:
     - YADAMU-NET
   ports:
    - 1025:1025
   volumes:
     - YADAMU_01-SHARED:/mnt/shared
     - ${TDVM_BASE:?set TDVM_BASE to the base directory makeBase.sh built}:/vm/base:ro
   devices:
     - /dev/kvm:/dev/kvm
   stop_grace_period: 3m
   healthcheck:
     test: ["CMD", "/usr/local/bin/tdvm.sh", "health"]
     interval: 30s
     timeout: 15s
     start_period: 10m
   logging: *default-logging

volumes:
  YADAMU_01-SHARED:
    name: YADAMU_01-SHARED

networks: 
  YADAMU-NET:
     name: YADAMU-NET
