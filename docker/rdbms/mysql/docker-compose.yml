# Bounded container logs. json-file has NO size limit by default, so a
# container's log grows until the container is removed. 5 x 20MB = 100MB
# ceiling per container, rotated segments gzipped.
#
# Declared PER SERVICE rather than as a daemon-wide default: log options are
# stamped onto a container when it is CREATED, so setting them here needs no
# dockerd restart, and the value is visible in the file you are reading instead
# of in /etc/docker/daemon.json on some host.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"
    compress: "true"

services:

  MYSQL80-01: 
    logging: *default-logging
    container_name: MYSQL80-01
    hostname: MYSQL80-01
    image:  mysql:8.0.37
    command: --secure-file-priv=/mnt/shared  
    mem_limit: '10gb'
    shm_size: '2gb'
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_NICE  # CAP_SYS_NICE
    networks:
      YADAMU-NET:
        aliases:
          - MYSQL-DB
    ports: 
      - "33061:3306"
    environment:
      MYSQL_ROOT_PASSWORD: oracle  
      LC_ALL: C.UTF-8      
    volumes:
      - YADAMU_01-SHARED:/mnt/shared
      - MYSQL80-01-VOLUME:/var/lib/mysql 
    restart: always
    
  MYSQL90-01: 
    logging: *default-logging
    container_name: MYSQL90-01
    hostname: MYSQL90-01
    image:  mysql:9.0.1
    command: --secure-file-priv=/mnt/shared 
    mem_limit: '16gb'          #
    memswap_limit: -1     # allow unlimited swap
    shm_size: '2gb'
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_NICE  # CAP_SYS_NICE
    networks:
      YADAMU-NET:
        aliases:
          - MYSQL-DB
    ports: 
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: oracle  
      LC_ALL: C.UTF-8      
    volumes:
      - YADAMU_01-SHARED:/mnt/shared
      - MYSQL90-01-VOLUME:/var/lib/mysql 
    restart: always  
   
  MYSQL26-01: 
    logging: *default-logging
    container_name: MYSQL26-01
    hostname: MYSQL26-01
    image:  mysql:latest
    command: --secure-file-priv=/mnt/shared 
    mem_limit: '16gb'          #
    memswap_limit: -1     # allow unlimited swap
    shm_size: '2gb'
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_NICE  # CAP_SYS_NICE
    networks:
      YADAMU-NET:
        aliases:
          - MYSQL-DB
    ports: 
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: oracle  
      LC_ALL: C.UTF-8      
    volumes:
      - YADAMU_01-SHARED:/mnt/shared
      - MYSQL26-01-VOLUME:/var/lib/mysql 
    restart: always
    
networks: 
  YADAMU-NET:
     name: YADAMU-NET

volumes:
  YADAMU_01-SHARED:
    name: YADAMU_01-SHARED
  MYSQL80-01-VOLUME:
  MYSQL90-01-VOLUME:
  MYSQL26-01-VOLUME:
