
# Bounded container logs. json-file has NO size limit by default, so a
# container's log grows until the container is removed. 5 x 20MB = 100MB
# ceiling per container, rotated segments gzipped.
#
# Declared PER SERVICE rather than as a daemon-wide default: log options are
# stamped onto a container when it is CREATED, so setting them here needs no
# dockerd restart, and the value is visible in the file you are reading instead
# of in /etc/docker/daemon.json on some host.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"
    compress: "true"

services:

  MONGO40-01: 
    logging: *default-logging
    container_name: MONGO40-01
    hostname: MONGO40-01
    image:  mongo:4
    mem_limit: '12gb'
    shm_size: '2gb'
    security_opt:
      - seccomp:unconfined
    networks:
      - YADAMU-NET
    ports: 
      - "27018:27017"
    volumes:
      - MONGO40-01-VOLUME:/data/db 
    restart: always

 MONGO50-01: 
    container_name: MONGO50-01
    hostname: MONGO50-01
    image:  mongo:5 
    mem_limit: '10gb'
    shm_size: '2gb'
    security_opt:
      - seccomp:unconfined
    networks:
      - YADAMU-NET
    ports: 
      - "27019:27017"
    volumes:
      - MONGO50-01-VOLUME:/data/db 
    restart: always
    
 MONGO60-01: 
    container_name: MONGO60-01
    hostname: MONGO60-01
    image:  mongo:6 
    mem_limit: '10gb'
    shm_size: '2gb'
    security_opt:
      - seccomp:unconfined
    networks:
      - YADAMU-NET
    ports: 
      - "27020:27017"
    volumes:
      - MONGO60-01-VOLUME:/data/db 
    restart: always

 MONGO70-01: 
    container_name: MONGO60-01
    hostname: MONGO60-01
    image:  mongo:7
    mem_limit: '10gb'
    shm_size: '2gb'
    security_opt:
      - seccomp:unconfined
    networks:
      - YADAMU-NET
    ports: 
      - "27020:27017"
    volumes:
      - MONGO70-01-VOLUME:/data/db 
    restart: always


  MONGO90-01: 
    logging: *default-logging
    container_name: MONGO90-01
    hostname: MONGO90-01
    image:  mongo:latest 
    mem_limit: '16gb'          #
    memswap_limit: -1     # allow unlimited swap
    shm_size: '2gb'
    security_opt:
      - seccomp:unconfined
    networks:
      YADAMU-NET:
        aliases:
          - MONGO-DB
    ports: 
      - "27017:27017"
    volumes:
      - MONGO90-01-VOLUME:/data/db 
    restart: always
    
networks: 
  YADAMU-NET:
     name: YADAMU-NET

volumes:
  YADAMU_01-SHARED:
    name: YADAMU_01-SHARED
  MONGO40-01-VOLUME:
  MONGO50-01-VOLUME:
  MONGO60-01-VOLUME:
  MONGO70-01-VOLUME:
  MONGO90-01-VOLUME:
    

    