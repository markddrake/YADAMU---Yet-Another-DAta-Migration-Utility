# Bounded container logs. json-file has NO size limit by default, so a
# container's log grows until the container is removed. 5 x 20MB = 100MB
# ceiling per container, rotated segments gzipped.
#
# Declared PER SERVICE rather than as a daemon-wide default: log options are
# stamped onto a container when it is CREATED, so setting them here needs no
# dockerd restart, and the value is visible in the file you are reading instead
# of in /etc/docker/daemon.json on some host.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"
    compress: "true"

services:

  ROACH01-01:
    logging: *default-logging
    container_name: ROACH01-01
    hostname: ROACH01-01
    image:  cockroachdb/cockroach
    command: start --advertise-addr=ROACH01-01:26357  --listen-addr=ROACH01-01:26357  --http-addr=ROACH01-01:8080  --sql-addr=ROACH01-01:26257 --insecure --store=node1 --join=ROACH01-01,ROACH01-02,ROACH01-03
    mem_limit: '8gb'
    shm_size: '1gb'
    security_opt:
     - seccomp:unconfined
    networks:
      - YADAMU-NET
    ports: 
      - "26257:26257"
      - "8080:8080"
    volumes:
      - YADAMU_01-SHARED:/mnt/shared
      - ROACH01-01-DATA:/cockroach/cockroach-data
    restart: always

  ROACH01-02:
    logging: *default-logging
    container_name: ROACH01-02
    hostname: ROACH01-02
    image:  cockroachdb/cockroach
    command: start --advertise-addr=ROACH01-02:26357  --listen-addr=ROACH01-02:26357  --http-addr=ROACH01-02:8081  --sql-addr=ROACH01-02:26258  --insecure --join=ROACH01-01,ROACH01-02,ROACH01-03 
    mem_limit: '8gb'
    shm_size: '1gb'
    security_opt:
     - seccomp:unconfined
    networks:
      - YADAMU-NET
    ports: 
      - "26258:26258"
      - "8081:8081"
    volumes:
      - YADAMU_01-SHARED:/mnt/shared
      - ROACH01-02-DATA:/cockroach/cockroach-data
    restart: always

  ROACH01-03:
    logging: *default-logging
    container_name: ROACH01-03
    hostname: ROACH01-03
    image:  cockroachdb/cockroach
    command: start --advertise-addr=ROACH01-03:26357  --listen-addr=ROACH01-03:26357  --http-addr=ROACH01-03:8082  --sql-addr=ROACH01-03:26259  --insecure --join=ROACH01-01,ROACH01-02,ROACH01-03 
    mem_limit: '8gb'
    shm_size: '1gb'
    security_opt:
     - seccomp:unconfined
    networks:
      - YADAMU-NET
    ports: 
      - "26259:26259"
      - "8082:8082"
    volumes:
      - YADAMU_01-SHARED:/mnt/shared
      - ROACH01-03-DATA:/cockroach/cockroach-data
    restart: always
    
volumes:
  ROACH01-01-DATA:
  ROACH01-02-DATA:
  ROACH01-03-DATA:
  YADAMU_01-SHARED:
    name: YADAMU_01-SHARED

networks: 
  YADAMU-NET:
     name: YADAMU-NET

